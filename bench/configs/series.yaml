# Benchmark series: the embryos and the cross-species pairs (bench/README.md).
# Section lists are frozen here (resolved once from laterality/laterality_scores.csv with
# crossspecies.embryo_sections, file order), so every run uses the same sections.
# L ranges in the notes are L_pair (human) and raw L (mouse).
# Pairs are numbered by stage (2026-10-29): old X4 -> X5, X5 -> X9, X6 -> X8; X4, X6, X7, X10 are new. The caches
# and results on the NAS and LRZ were renamed then; notebook outputs from before that date show the old ids.

embryos:
  # ---- human (HESTA)
  CS12-13_E2: {dataset: HESTA, stage: CS12-13, sections: [CS12-13_E2S1, CS12-13_E2S2, CS12-13_E2S3, CS12-13_E2S4,
                                                         CS12-13_E2S5, CS12-13_E2S6, CS12-13_E2S7, CS12-13_E2S8]}
  CS14-15_E2: {dataset: HESTA, stage: CS14-15, sections: [CS14-15_E2S1, CS14-15_E2S2, CS14-15_E2S3, CS14-15_E2S4,
                                                         CS14-15_E2S5, CS14-15_E2S6, CS14-15_E2S7, CS14-15_E2S8,
                                                         CS14-15_E2S9, CS14-15_E2S10]}
  CS17_E1:    {dataset: HESTA, stage: CS17, sections: [CS17_E1S1, CS17_E1S2, CS17_E1S3, CS17_E1S4, CS17_E1S5,
                                                       CS17_E1S6, CS17_E1S7, CS17_E1S8, CS17_E1S9, CS17_E1S10]}
  CS18_E1:    {dataset: HESTA, stage: CS18, sections: [CS18_E1S1, CS18_E1S2, CS18_E1S3, CS18_E1S4, CS18_E1S5, CS18_E1S6]}
  CS19_E2:    {dataset: HESTA, stage: CS19, sections: [CS19_E2S1, CS19_E2S2, CS19_E2S3, CS19_E2S4]}
  CS20_E2:    {dataset: HESTA, stage: CS20, sections: [CS20_E2S1, CS20_E2S2, CS20_E2S3, CS20_E2S4]}
  CS23_E1:    {dataset: HESTA, stage: CS23, sections: [CS23_E1S1, CS23_E1S2, CS23_E1S3]}
  # CS23_E2S2 and CS23_E2S4 are excluded: their h5ad files hold only log-normalized X (no counts layer, no raw)
  CS23_E2:    {dataset: HESTA, stage: CS23, sections: [CS23_E2S1, CS23_E2S3, CS23_E2S5,
                                                       CS23_E2S6, CS23_E2S7, CS23_E2S8, CS23_E2S9, CS23_E2S10]}
  # ---- mouse (MOSTA)
  E9.5_E2:    {dataset: MOSTA, stage: E9.5, sections: [E9.5_E2S1, E9.5_E2S2, E9.5_E2S3, E9.5_E2S4]}
  E10.5_E1:   {dataset: MOSTA, stage: E10.5, sections: [E10.5_E1S1, E10.5_E1S2, E10.5_E1S3]}
  E11.5_E1:   {dataset: MOSTA, stage: E11.5, sections: [E11.5_E1S1, E11.5_E1S2, E11.5_E1S3, E11.5_E1S4]}
  E12.5_E1:   {dataset: MOSTA, stage: E12.5, sections: [E12.5_E1S1, E12.5_E1S2, E12.5_E1S3, E12.5_E1S4, E12.5_E1S5]}
  E13.5_E1:   {dataset: MOSTA, stage: E13.5, sections: [E13.5_E1S1, E13.5_E1S2, E13.5_E1S3, E13.5_E1S4]}
  E14.5_E1:   {dataset: MOSTA, stage: E14.5, sections: [E14.5_E1S1, E14.5_E1S2, E14.5_E1S3, E14.5_E1S4, E14.5_E1S5]}
  E15.5_E1:   {dataset: MOSTA, stage: E15.5, sections: [E15.5_E1S1, E15.5_E1S2, E15.5_E1S3, E15.5_E1S4]}
  # ---- smoke test: the sections on the local machine (not real embryos)
  smoke_H:    {dataset: HESTA, stage: CS12-13, sections: [CS12-13_E1S3, CS12-13_E2S6]}
  smoke_M:    {dataset: MOSTA, stage: E9.5, sections: [E9.5_E1S1, E9.5_E2S1]}

pairs:
  # cross-species: a = human, b = mouse; both directions; numbered by stage
  X1: {a: CS12-13_E2, b: E9.5_E2, stage: early, overlap: partial, tiers: [dev, screen, full],
       note: "human 0.33-0.53, mouse 0.48-0.59; smallest sections"}
  X2: {a: CS14-15_E2, b: E10.5_E1, stage: early, overlap: mouse inside human, tiers: [screen, full],
       note: "human 0.05-0.79, mouse 0.07-0.35; the midline anchor"}
  X3: {a: CS17_E1, b: E11.5_E1, stage: mid (ambiguous), overlap: mouse inside human, tiers: [screen, full],
       note: "human 0.47-1.00, mouse 0.71-0.77; thin mouse stack"}
  X4: {a: CS17_E1, b: E12.5_E1, stage: mid, overlap: partial (mouse gap 0.12-0.75), tiers: [full],
       note: "human 0.47-1.00, mouse 0.10-0.81; the human of X3 against the next mouse stage"}
  X5: {a: CS18_E1, b: E12.5_E1, stage: mid, overlap: human inside mouse (mouse gap 0.12-0.75),
       tiers: [dev, screen, full], note: "the development pair (X4 before 2026-10-29)"}
  X6: {a: CS19_E2, b: E12.5_E1, stage: mid, overlap: partial, tiers: [full],
       note: "human 0.06-0.46, mouse 0.10-0.81; only E12.5_E1S3 (0.10) lies in the human range"}
  X7: {a: CS19_E2, b: E13.5_E1, stage: late, overlap: mouse inside human, tiers: [full],
       note: "human 0.06-0.46, mouse 0.04-0.21; two mouse sections (0.04) lie just below the human range"}
  X8: {a: CS20_E2, b: E13.5_E1, stage: late, overlap: none, tiers: [full],
       note: "no depth overlap: human 0.27-0.76, mouse 0.04-0.21 (X6 before 2026-10-29)"}
  X9: {a: CS23_E2, b: E14.5_E1, stage: late, overlap: good, tiers: [screen, full],
       note: "human 0.39-0.79, mouse 0.47-0.83; largest sections (X5 before 2026-10-29)"}
  X10: {a: CS23_E2, b: E15.5_E1, stage: late, overlap: human inside mouse, tiers: [full],
        note: "human 0.39-0.79, mouse 0.32-0.83; the human of X9 against the next mouse stage"}
  # smoke test (local files)
  S_X: {a: smoke_H, b: smoke_M, tiers: [smoke], note: "smoke test"}
