# Step 2 of docs/st_3d_alignment_strategies.md §6: the within-species gates G1 (held-out section) and G2 (odd/even
# split) for the field, on the Dev embryos. The blocks reduce, features, fgw and stack are step1.yaml's, so the
# section, feature and stack caches are shared with A (run `prepare --tier dev` once; for the zscore_by grid also
# `prepare --tier dev --set features.zscore_by=embryo`).
# Run `python -m mgw.bench gates g1` / `gates g2` (this config is the default of `gates`); tables go to
# <root>/results/gates/gates_g1/ and gates_g2/.
name: gates
series: series.yaml
reference: reference.yaml

reduce:
  max_obs: 5000
  subsample: voronoi
  agg: sum
  lloyd_iter: 3
  drop_labels: [Cavity, Extraembryonic Tissue]

features:
  pca_comp: 30
  n_hvg: 2000
  n_eval_genes: 500
  m_scale_quantile: 0.99
  zscore_by: section         # the grid below also runs `embryo`

fgw:
  alpha: 0.5
  epsilon: 5.0e-3
  inner_maxit: 3000
  outer_maxit: 200
  inner_tol: 1.0e-7
  outer_tol: 1.0e-7

stack:
  order: auto
  pair_alpha: 0.8
  pair_eps: 1.0e-2
  icp_lambda: 0.5
  icp_iter: 15
  icp_eps: 5.0e-3
  section_flip: auto
  global_sweeps: 2

field:                       # the setting G1 starts from (the grid overrides some of it)
  width: 128
  depth: 3
  n_freq: 64
  sigma_xy: 4.0
  sigma_z: 1.0
  steps: 3000
  batch: 2048
  lr: 2.0e-3
  lambda_depth: 1.0
  lambda_occ: 0.5
  lambda_smooth: 1.0e-3
  occ_out: 2.0
  occ_jitter: 0.5
  device: auto

gates:
  embryos:                   # embryo -> the pair whose features its field regresses (the stage-2 pair of §6 step 3)
    CS18_E1: X4
    CS12-13_E2: X1
    E12.5_E1: X4
    E9.5_E2: X1
  factor: 2.0                # G1 margin: factor x the SD over seeds of the field's r_heldout
  g1:
    k_regressor: 15          # feature -> held-out gene kNN regressor, fitted on the other sections
    zscore_by: [section, embryo]
    grid:                    # config key -> values; the product with zscore_by is the G1 grid
      field.sigma_z: [0.5, 1.0, 2.0]
  g2:                        # stage 2 between the halves: the volume pipeline's settings (step3.yaml)
    n_samples: 3000          # per half
    tau: 0.95
    epsilon: null            # null: fgw.epsilon
    unbalanced_correction: true
    k_query: 8
    min_sections: 4          # a 2/2 split at least
    variants: [common, reest]  # common: the full stack's z; reest: each half re-estimates its gaps

metrics:
  present_min_bins: 5
  present_min_tiles: 1
  coverage_share: 0.1
  foldover_k: 16
  topk: 64
  presence: embryo

seeds:                       # the gates run seeds.dev (or --seeds); >= 2 seeds give the G1 noise margin
  smoke: [0]
  dev: [0, 1, 2]
  screen: [0]
  full: [0]
