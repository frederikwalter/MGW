[project]
name = "mgw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "frederikwalter", email = "frederikpwalter@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anndata>=0.13.3.post0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "numpy>=2.5.3",
    "ott-jax>=0.6.0",
    "scanpy>=1.12.4",
    "squidpy>=1.8.3",
    "torch>=2.14.0",
]

[project.scripts]
mgw = "mgw:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
