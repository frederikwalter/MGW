[project]
name = "mgw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "frederikwalter", email = "frederikpwalter@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anndata>=0.13.3.post0",
    "ipywidgets>=8.1.9",
    "jax>=0.11.1",
    "jax[cuda13]>=0.11.1; sys_platform == 'linux'",
    "jupyter>=1.1.1",
    "moscot>=0.5.2",
    "numpy>=2.5.3",
    "ott-jax>=0.6.0",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
    "scanpy>=1.12.4",
    "scikit-learn>=1.9.1",
    "squidpy>=1.8.3",
    "torch>=2.14.0",
]

[project.scripts]
mgw-bench = "mgw.bench.__main__:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "mgw"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "papermill>=2.7.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
